<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paramétrage des opérations – ReconciliApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F0E9;--surface:#fff;--soft:#FAF8F3;--ink:#16233B;--muted:#6A7383;--line:#E6E0D2;
  --primary:#2D6BE0;--danger:#C93C37;--formula:#5B4FD6;
  --font-ui:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;--font-display:'Instrument Serif',Georgia,serif;--font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1526;--surface:#16203A;--soft:#121B33;--ink:#E8ECF4;--muted:#9AA6BC;--line:#26335A;--primary:#6E9CF5;--danger:#F0706B;--formula:#9E94F7}}
:root[data-theme="dark"]{--bg:#0E1526;--surface:#16203A;--soft:#121B33;--ink:#E8ECF4;--muted:#9AA6BC;--line:#26335A;--primary:#6E9CF5;--danger:#F0706B;--formula:#9E94F7}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-behavior:smooth;scroll-padding-top:24px}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:is(button,input,select,a):focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 40%,transparent);outline-offset:2px}
.page{max-width:1280px;margin:0 auto;padding:30px 28px 120px}
.top h1{font:400 clamp(30px,4vw,42px)/1.05 var(--font-display);margin:0 0 6px}
.top p{margin:0 0 26px;color:var(--muted);max-width:64ch}
.shell{display:grid;grid-template-columns:210px 1fr;gap:32px;align-items:start}
.nav{position:sticky;top:calc(24px + env(safe-area-inset-top,0px));display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;border-left:3px solid transparent}
.nav a:hover{background:var(--surface);color:var(--ink)}
.nav a.on{background:var(--surface);color:var(--ink);border-left-color:var(--primary);font-weight:600}
.nav a b{margin-left:auto;font-size:12px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted)}
main{display:grid;gap:22px;min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}
.sh{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap}
.sh h2{font:400 26px/1.1 var(--font-display);margin:0 0 4px}
.sh p{margin:0;color:var(--muted);font-size:13px;max-width:70ch}
.sh .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;transition:background .15s,filter .15s}
.btn svg{width:15px;height:15px}.btn:hover{background:var(--soft)}
.btn.add{color:var(--primary);border-color:color-mix(in srgb,var(--primary) 40%,var(--line))}
.btn.p{background:var(--primary);border-color:var(--primary);color:#fff}.btn.p:hover{background:var(--primary);filter:brightness(1.08)}

.grid{display:grid;gap:18px 16px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.fld{min-width:0;display:flex;flex-direction:column;gap:6px}
.fld>label,.lbl{font-weight:600;font-size:13px}
.req{color:var(--danger);margin-left:3px}
.inp,.sel{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.inp:hover,.sel:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--line))}
.inp:focus,.sel:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.inp:disabled,.sel:disabled{background:var(--soft);color:var(--muted);cursor:not-allowed}
.inp.bad{border-color:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 14%,transparent)}
.mono{font-family:var(--font-mono);font-size:12.5px}
.hint{color:var(--muted);font-size:12.5px;line-height:1.5}
.tk{font:500 11.5px var(--font-mono);color:var(--formula);background:color-mix(in srgb,var(--formula) 10%,transparent);border-radius:5px;padding:1px 6px;white-space:nowrap}
.sel{appearance:none;-webkit-appearance:none;padding-right:32px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.ib{width:36px;height:36px;flex:none;border:0;border-radius:9px;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;opacity:.6;transition:all .15s}
.ib svg{width:17px;height:17px}.ib:hover,.ib:focus-visible{opacity:1;background:color-mix(in srgb,var(--danger) 11%,transparent);color:var(--danger)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

/* Types supplémentaires */
.xrow{display:grid;grid-template-columns:1fr 1fr 1fr 36px;gap:14px;align-items:end;padding:14px 0;border-top:1px solid var(--line)}
.xrow:first-child{border-top:0;padding-top:0}
.xrow .ib{margin-bottom:1px}

/* Règles */
.rule{border:1px solid var(--line);border-radius:14px;background:var(--soft);padding:18px;display:grid;gap:14px}
.rule+.rule{margin-top:14px}
.rhead{display:flex;gap:14px;align-items:flex-end}.rhead .fld{flex:1}
.comps{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:clip}
.crow,.chead{display:grid;grid-template-columns:1.1fr 1.2fr 1.1fr 1.4fr .9fr 84px 36px;gap:10px;align-items:center;padding:0 12px}
.chead{padding-top:9px;padding-bottom:9px;background:var(--soft);border-bottom:1px solid var(--line);font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.crow{padding-top:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}.crow:last-of-type{border-bottom:0}
.crow .inp,.crow .sel{padding:8px 10px;font-size:13px}
.num{text-align:right}
.cfoot{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ml{display:none;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:3px}

.keys{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.key{display:flex;gap:8px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--muted)}
.key code{font:500 12.5px var(--font-mono);color:var(--ink)}

.dirty{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);background:var(--ink);color:var(--surface);border-radius:14px;padding:10px 12px 10px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 14px 34px -10px #0007;transition:transform .25s;z-index:6;max-width:calc(100% - 24px)}
.dirty.show{transform:translate(-50%,0)}.dirty .btn{padding:8px 14px}.dirty .btn.g{background:transparent;color:inherit;border-color:#ffffff40}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 16px;box-shadow:0 10px 30px -12px #0005;display:flex;gap:14px;align-items:center;transition:all .2s;z-index:7}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:var(--primary);font-weight:600;cursor:pointer}

@media (max-width:1100px){
  .shell{grid-template-columns:1fr;gap:16px}
  .nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;overflow-x:auto;background:var(--bg);padding:8px 0;gap:6px}
  .nav a{white-space:nowrap;border-left:0;border:1px solid var(--line);background:var(--surface)}.nav a.on{border-color:var(--primary)}
  .chead{display:none}
  .crow{grid-template-columns:1fr 1fr;row-gap:10px;padding:14px 12px}.ml{display:block}
  .crow .ib{grid-column:2;justify-self:end}
  .xrow{grid-template-columns:1fr 1fr}.xrow .ib{justify-self:end;grid-column:2}
}
@media (max-width:700px){.g3,.g2{grid-template-columns:1fr}.page{padding:22px 14px 120px}.xrow,.crow{grid-template-columns:1fr}.crow .ib,.xrow .ib{grid-column:auto}.card{padding:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <h1>Paramétrage des opérations</h1>
    <p>Libellés des types d'opérations (colonne Type de l'OPPART), cas de commentaires et règles de régularisation.</p>
  </header>
  <div class="shell">
    <nav class="nav" id="nav" aria-label="Sections">
      <a href="#s-types">Types d'opérations</a>
      <a href="#s-extra">Types supplémentaires<b id="n-extra"></b></a>
      <a href="#s-regul">Régularisation<b id="n-regul"></b></a>
      <a href="#s-cas">Cas de commentaires</a>
      <a href="#s-agg">Agrégats des écarts</a>
    </nav>
    <main id="main"></main>
  </div>
</div>
<div class="dirty" id="dirty" role="status"><span>Modifications non enregistrées</span><button class="btn g" id="cancel" type="button">Annuler</button><button class="btn p" id="save" type="button">Enregistrer</button></div>
<div class="toast" id="toast" role="status"><span id="tmsg"></span><button id="undo" type="button" hidden>Annuler</button></div>

<script>
var uid=10,nid=function(){return ++uid};
var S={
 main:{principale:'IMPACT_COMPTE_GENERAL',frais:'FRAIS_TRANSACTION',commission:'VERSEMENT_COMMISSION'},
 extras:[{id:1,lbl:'COMPENSE',cb:'',cp:'COMPENSE'}],
 rules:[{id:2,cas:'TRX SANS OP',comps:[
  {id:3,src:'bo',typ:'principale',sign:'svc',svc:'CASHIN',def:'neg',coef:1},
  {id:4,src:'bo',typ:'principale',sign:'source',svc:'CASHIN, CASHOUT',def:'pos',coef:1}]}],
 cases:{aucunPart:'TRX SANS OP',comSansFrais:'TRX SANS FRAIS',fraisSeule:'REGUL FRAIS',fraisSansCom:'TRXSC',comSansPrinc:'TRX SANS COMMISSION',comSeule:'REGCOM',fraisEtCom:'RGFRAIS & REGCOM',principaleSeule:'TRX SANS FRAIS, SANS COMMISSION',ecart:'Ecart BO',lignePartSansBO:'Régularisation TRX'},
 agg:{filter:'APM.AggTypesFilter',meta:'APM.AggTypesMetaTotal'}
};
var CASES=[
 ['aucunPart','Aucune opération partenaire (BO)',''],['comSansFrais','Opération commission sans frais',''],['fraisSeule','Opération frais seule',''],
 ['fraisSansCom','Opération frais sans commission','Cas IMPACT_COMPTE_GENERAL + FRAIS_TRANSACTION sans VERSEMENT_COMMISSION'],
 ['comSansPrinc','Opération commission sans opération principale',''],
 ['comSeule','Opération commission seule','Cas VERSEMENT_COMMISSION sans IMPACT_COMPTE_GENERAL (commentaire côté partenaire uniquement)'],
 ['fraisEtCom','Opération frais et commission','Cas FRAIS_TRANSACTION + VERSEMENT_COMMISSION sans IMPACT_COMPTE_GENERAL'],
 ['principaleSeule','Opération principale seule',''],['ecart','Écart',''],['lignePartSansBO','Ligne partenaire sans BO','']];
var SRC=[['bo','Montant du BO'],['bofrais','Frais du BO'],['part','Montant partenaire'],['partfrais','Frais partenaire']];
var SIGN=[['source','Signe de la source'],['pos','Toujours positif'],['neg','Toujours négatif'],['svc','Selon les services']];
var DEF=[['neg','Négatif'],['pos','Positif']];
var snap=JSON.stringify(S),prev=null,tt,$=function(i){return document.getElementById(i)};
var ICO={add:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>',
 gen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l1.8 4.2L18 10l-4.2 1.8L12 16l-1.8-4.2L6 10l4.2-1.8z"/></svg>'};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function hint(t){return t?'<span class="hint">'+t.replace(/[A-Z]{3,}(?:_[A-Z]+)+/g,function(m){return '<code class="tk">'+m+'</code>'})+'</span>':''}
function fld(label,attrs,val,o){o=o||{};var id='f'+nid();
 return '<div class="fld"><label for="'+id+'">'+label+(o.req?'<span class="req" aria-hidden="true">*</span>':'')+'</label><input id="'+id+'" class="inp'+(o.mono?' mono':'')+'" '+attrs+' value="'+esc(val)+'" placeholder="'+(o.ph||'')+'"'+(o.req?' data-req="1" aria-required="true"':'')+'>'+hint(o.hint)+'</div>'}
function opt(list,cur){return list.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===cur?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')}
function typeOpts(){return [['principale',S.main.principale],['frais',S.main.frais],['commission',S.main.commission]].concat(S.extras.map(function(x){return ['x'+x.id,x.lbl||'(sans libellé)']}))}
function card(id,title,desc,acts,body){return '<section class="card" id="'+id+'"><div class="sh"><div><h2>'+title+'</h2><p>'+desc+'</p></div><div class="acts">'+(acts||'')+'</div></div>'+body+'</section>'}
function secTypes(){return card('s-types','Types d’opérations','Libellés des types d’opérations utilisés dans la colonne Type de l’OPPART.','',
 '<div class="grid g3">'+fld('Opération principale','data-s="main" data-k="principale"',S.main.principale,{req:1,mono:1})+fld('Opération frais','data-s="main" data-k="frais"',S.main.frais,{req:1,mono:1})+fld('Opération commission','data-s="main" data-k="commission"',S.main.commission,{req:1,mono:1})+'</div>')}
function secExtra(){return card('s-extra','Types d’opérations supplémentaires','Types d’opération hors impact / frais / commission : le premier type déclaré présent dans un groupe sans '+'<code class="tk">'+S.main.principale+'</code> porte son propre commentaire.',
 '<button class="btn add" data-act="addx">'+ICO.add+'Ajouter un type</button>',
 S.extras.length?S.extras.map(function(x){return '<div class="xrow">'+fld('Libellé du type','data-s="extra" data-id="'+x.id+'" data-k="lbl"',x.lbl,{mono:1})+fld('Commentaire BO','data-s="extra" data-id="'+x.id+'" data-k="cb"',x.cb,{ph:'Laisser vide pour ne rien mettre'})+fld('Commentaire partenaire','data-s="extra" data-id="'+x.id+'" data-k="cp"',x.cp)+'<button class="ib" data-act="delx" data-id="'+x.id+'" aria-label="Supprimer le type '+esc(x.lbl)+'">'+ICO.del+'</button></div>'}).join(''):'<div class="empty">Aucun type supplémentaire.</div>')}
function crow(r,c){var on=c.sign==='svc',t=typeOpts(),ok=t.some(function(o){return o[0]===c.typ});if(!ok)c.typ='principale';
 var a='data-s="comp" data-rid="'+r.id+'" data-id="'+c.id+'"';
 return '<div class="crow" '+a+'><div><span class="ml">Source</span><select class="sel" '+a+' data-k="src" aria-label="Source">'+opt(SRC,c.src)+'</select></div>'
 +'<div><span class="ml">Type OPPART</span><select class="sel mono" '+a+' data-k="typ" aria-label="Type OPPART">'+opt(t,c.typ)+'</select></div>'
 +'<div><span class="ml">Signe</span><select class="sel" '+a+' data-k="sign" aria-label="Signe">'+opt(SIGN,c.sign)+'</select></div>'
 +'<div><span class="ml">Services négatifs (séparés par des virgules)</span><input class="inp mono" '+a+' data-k="svc" value="'+esc(c.svc)+'" aria-label="Services négatifs"'+(on?'':' disabled')+'></div>'
 +'<div><span class="ml">Signe par défaut</span><select class="sel" '+a+' data-k="def" aria-label="Signe par défaut"'+(on?'':' disabled')+'>'+opt(DEF,c.def)+'</select></div>'
 +'<div><span class="ml">Coefficient</span><input class="inp num" type="number" step="any" '+a+' data-k="coef" value="'+c.coef+'" aria-label="Coefficient"></div>'
 +'<button class="ib" data-act="delc" data-rid="'+r.id+'" data-id="'+c.id+'" aria-label="Supprimer le composant">'+ICO.del+'</button></div>'}
function secRegul(){return card('s-regul','Règles de régularisation','Définissez, pour un cas (libellé de commentaire), quels montants composent la régularisation et avec quel signe.',
 '<button class="btn add" data-act="addr">'+ICO.add+'Ajouter une règle</button>',
 S.rules.length?S.rules.map(function(r){return '<div class="rule"><div class="rhead">'+fld('Cas (commentaire)','data-s="rule" data-id="'+r.id+'" data-k="cas"',r.cas,{req:1})+'<button class="ib" data-act="delr" data-id="'+r.id+'" aria-label="Supprimer la règle '+esc(r.cas)+'">'+ICO.del+'</button></div>'
  +'<div class="comps"><div class="chead"><span>Source</span><span>Type OPPART</span><span>Signe</span><span>Services négatifs</span><span>Signe par défaut</span><span>Coefficient</span><span></span></div>'
  +r.comps.map(function(c){return crow(r,c)}).join('')
  +'<div class="cfoot"><button class="btn add" data-act="addc" data-id="'+r.id+'">'+ICO.add+'Ajouter un composant</button><span class="hint">Commentaires à porter dans la colonne Commentaire.</span></div></div></div>'}).join(''):'<div class="empty">Aucune règle de régularisation.</div>')}
function secCas(){return card('s-cas','Cas de commentaires','Libellé de commentaire utilisé pour chaque cas d’opération.','',
 '<div class="grid g2">'+CASES.map(function(c){return fld(c[1],'data-s="cases" data-k="'+c[0]+'"',S.cases[c[0]],{req:1,hint:c[2]})}).join('')+'</div>')}
function secAgg(){return card('s-agg','Agrégats des écarts','Pour chaque type de commentaire, définissez son agrégation et sa régularisation côté BO et côté partenaire.',
 '<button class="btn" data-act="gen">'+ICO.gen+'Générer depuis les commentaires</button><button class="btn add" data-act="agg">'+ICO.add+'Ajouter un type d’agrégat</button>',
 '<div class="keys"><div class="key">Filtre<code>'+esc(S.agg.filter)+'</code></div><div class="key">Méta total<code>'+esc(S.agg.meta)+'</code></div></div>')}
function renderAll(){$('main').innerHTML=secTypes()+secExtra()+secRegul()+secCas()+secAgg();counts();dirty()}
function renderSec(id,fn){var el=$(id);el.outerHTML=fn();counts();dirty()}
function counts(){$('n-extra').textContent=S.extras.length;$('n-regul').textContent=S.rules.length}
function dirty(){$('dirty').classList.toggle('show',JSON.stringify(S)!==snap)}
function toast(m,u){$('tmsg').textContent=m;$('undo').hidden=!u;$('toast').classList.add('show');clearTimeout(tt);tt=setTimeout(function(){$('toast').classList.remove('show')},u?5000:2400)}
function rule(id){return S.rules.filter(function(r){return r.id==id})[0]}
function del(msg){$('undo').dataset.has=1;toast(msg,1)}
function focusLast(sel){var l=document.querySelectorAll(sel);if(l.length){var e=l[l.length-1];e.focus();e.scrollIntoView({block:'center'})}}

$('main').addEventListener('input',function(e){
 var t=e.target,s=t.dataset.s,k=t.dataset.k;if(!s)return;
 if(t.dataset.req&&t.value.trim())t.classList.remove('bad');
 var v=t.type==='number'?(parseFloat(t.value)||0):t.value;
 if(s==='main'){S.main[k]=v;var o=document.querySelector('select[data-k="typ"] option[value="'+k+'"]');
   document.querySelectorAll('select[data-k="typ"] option[value="'+k+'"]').forEach(function(x){x.textContent=v})}
 else if(s==='cases')S.cases[k]=v;
 else if(s==='extra'){var x=S.extras.filter(function(a){return a.id==t.dataset.id})[0];x[k]=v;
   if(k==='lbl')document.querySelectorAll('select[data-k="typ"] option[value="x'+x.id+'"]').forEach(function(o){o.textContent=v||'(sans libellé)'})}
 else if(s==='rule')rule(t.dataset.id)[k]=v;
 else if(s==='comp'){var c=rule(t.dataset.rid).comps.filter(function(a){return a.id==t.dataset.id})[0];c[k]=v;
   if(k==='sign'){var row=t.closest('.crow');row.querySelectorAll('[data-k="svc"],[data-k="def"]').forEach(function(f){f.disabled=v!=='svc'})}}
 dirty()});
$('main').addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,id=b.dataset.id,before=JSON.stringify(S);
 if(a==='addx'){S.extras.push({id:nid(),lbl:'',cb:'',cp:''});renderSec('s-extra',secExtra);renderSec('s-regul',secRegul);focusLast('#s-extra [data-k="lbl"]')}
 else if(a==='delx'){prev=before;S.extras=S.extras.filter(function(x){return x.id!=id});renderSec('s-extra',secExtra);renderSec('s-regul',secRegul);del('Type supprimé')}
 else if(a==='addr'){S.rules.push({id:nid(),cas:'',comps:[{id:nid(),src:'bo',typ:'principale',sign:'source',svc:'',def:'neg',coef:1}]});renderSec('s-regul',secRegul);focusLast('#s-regul [data-s="rule"]')}

 var bad=[].filter.call(document.querySelectorAll('[data-req]'),function(i){var e=!i.value.trim();i.classList.toggle('bad',e);return e});
 if(bad.length){bad[0].focus();bad[0].scrollIntoView({block:'center'});toast(bad.length+' champ'+(bad.length>1?'s':'')+' obligatoire'+(bad.length>1?'s':'')+' à renseigner');return}
 snap=JSON.stringify(S);dirty();toast('Modifications enregistrées')});

renderAll();
function spy(){var cur=null,y=window.innerHeight*.3;
 ['s-types','s-extra','s-regul','s-cas','s-agg'].forEach(function(i){var el=$(i);if(el&&el.getBoundingClientRect().top<=y)cur=i});
 links.forEach(function(l){l.classList.toggle('on',l.getAttribute('href')==='#'+(cur||'s-types'))})}
window.addEventListener('scroll',spy,{passive:true});spy();
