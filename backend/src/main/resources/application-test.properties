# =============================================================================
# Profil TEST - environnement de test / recette
# =============================================================================
# Objectif : executer l'application isolement sur une base MySQL DEDIEE.
#   - Base par defaut : Reconciliation_app_TEST
#   - Port backend    : 8086 (dev = 8085, prod = 8080)
#   - Frontend        : 4201 (npm run start:test)
#
# ATTENTION : ne JAMAIS faire pointer ce profil vers la base de
# developpement/production `Reconciliation_app`. Le script
# backend/start-test.ps1 verifie ce point avant le demarrage.
#
# Fichier local NON versionne (KEY=VALUE), charge automatiquement :
#   backend/.env.test (ou .env.test a la racine du depot)
# Les variables d'environnement gardent la priorite sur ce fichier.
#
# NB : ce fichier configure l'environnement d'EXECUTION "test".
#      Les tests automatises (mvn test) utilisent, eux,
#      src/test/resources/application-test.properties (base reco_test jetable).
# =============================================================================

spring.config.import=optional:file:./.env.test[.properties],optional:file:./backend/.env.test[.properties]

# -----------------------------------------------------------------------------
# Base de donnees TEST
# -----------------------------------------------------------------------------
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/Reconciliation_app_TEST?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&allowMultiQueries=true&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------------------------------------------------------
# JPA / Hibernate / Flyway (meme strategie que la production)
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Le schema de la base TEST est construit et versionne par Flyway.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Baseline schema ReconciliApp 2026-10-12
spring.flyway.validate-on-migrate=true

# -----------------------------------------------------------------------------
# Serveur
# -----------------------------------------------------------------------------
server.port=${TEST_SERVER_PORT:8086}

# -----------------------------------------------------------------------------
# Securite
# -----------------------------------------------------------------------------
# Secret JWT dedie au test. Genere automatiquement par start-test.ps1 dans
# backend/.env.test ; peut aussi etre fourni par variable d'environnement.
jwt.secret=${TEST_JWT_SECRET}
jwt.expiration=14400000

# Cookie de session distinct de celui du dev/prod : les cookies ne sont pas
# isoles par port sur localhost, et un jeton dev ne doit pas faire echouer le
# login sur l'environnement de test (et inversement).
app.auth.cookie-name=AUTH_TOKEN_TEST

# Compte plateforme du test (cree au premier demarrage, changement obligatoire).
# Email vide : aucun envoi vers une boite reelle.
app.super-admin.username=${TEST_SUPER_ADMIN_USERNAME:superadmin}
app.super-admin.password=${TEST_SUPER_ADMIN_PASSWORD:passer123}
app.super-admin.email=${TEST_SUPER_ADMIN_EMAIL:}

# -----------------------------------------------------------------------------
# CORS / URL frontend
# -----------------------------------------------------------------------------
app.cors.allowed-origins=${TEST_ALLOWED_ORIGINS:http://localhost:4201,https://localhost:4201,http://127.0.0.1:4201,http://localhost:4200,https://localhost:4200}
app.url=${TEST_APP_URL:http://localhost:4201}

# -----------------------------------------------------------------------------
# Dossiers de travail isoles (ne pas melanger avec le dev)
# -----------------------------------------------------------------------------
app.watch-folder.path=${TEST_WATCH_FOLDER:../watch-folder-test}
app.watch-folder.models-path=${TEST_WATCH_FOLDER_MODELS:../watch-folder-test/models}

# -----------------------------------------------------------------------------
# Emails : desactives par defaut (SMTP local type MailHog).
# Pour utiliser un vrai SMTP de test : TEST_MAIL_HOST / TEST_MAIL_PORT /
# TEST_MAIL_USERNAME / TEST_MAIL_PASSWORD / TEST_MAIL_AUTH=true / TEST_MAIL_STARTTLS=true.
# -----------------------------------------------------------------------------
spring.mail.host=${TEST_MAIL_HOST:localhost}
spring.mail.port=${TEST_MAIL_PORT:1025}
spring.mail.username=${TEST_MAIL_USERNAME:}
spring.mail.password=${TEST_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${TEST_MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${TEST_MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${TEST_MAIL_STARTTLS:false}

# Pas de relance e-mail quotidienne automatique sur la base de test.
reco.blocking-comment.mail-alert.cron=-

# -----------------------------------------------------------------------------
# Logs / DevTools
# -----------------------------------------------------------------------------
logging.level.com.reconciliation=INFO
logging.level.org.hibernate.SQL=WARN

# Environnement de test : pas de rechargement a chaud ni de valeurs par defaut DevTools.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
spring.devtools.add-properties=false
