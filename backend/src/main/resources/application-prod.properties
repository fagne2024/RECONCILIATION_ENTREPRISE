# Configuration de la base de données
# Utiliser des variables d'environnement pour les secrets (recommandé)
# Définir les variables d'environnement:
# Windows: set DB_PASSWORD=votre_mot_de_passe
# Linux/Mac: export DB_PASSWORD=votre_mot_de_passe
spring.datasource.url=jdbc:mysql://localhost:3306/Reconciliation_app?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&sslMode=PREFERRED&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA/Hibernate
# Le schema est gere par Flyway : Hibernate ne fait que VALIDER.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuration Flyway (versionnage du schema)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Baseline schema ReconciliApp 2026-10-12
spring.flyway.validate-on-migrate=true

# Configuration du serveur
server.port=8080

# Configuration de l'encodage UTF-8
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Désactiver la console H2

spring.h2.console.enabled=false

# Configuration des logs - Niveau réduit pour moins de verbosité
logging.level.org.springframework=INFO
logging.level.com.reconciliation=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.apache.poi=WARN
# Réduire le bruit des erreurs de parsing HTTP (scanners de port, clients mal configurés)
logging.level.org.apache.coyote.http11=WARN
logging.level.org.apache.catalina.connector=WARN

# Configuration optimisée pour fichiers volumineux (jusqu'à 700k lignes)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
spring.servlet.multipart.file-size-threshold=20MB
spring.servlet.multipart.location=/tmp

# JVM Memory Configuration - Optimisé pour 700k lignes
spring.jvm.memory.initial=4096m
spring.jvm.memory.max=12288m

# Configuration des timeouts étendus pour 700k lignes (30 minutes pour les très gros fichiers)
server.tomcat.connection-timeout=1800000
server.tomcat.max-http-form-post-size=3GB
server.tomcat.max-connections=300
server.tomcat.accept-count=150
server.tomcat.threads.max=300
server.tomcat.threads.min-spare=30

# Optimisations Hibernate pour 700k lignes
spring.jpa.properties.hibernate.jdbc.batch_size=2000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Configuration du cache Spring (Caffeine)
spring.cache.type=caffeine
spring.cache.cache-names=autoProcessingModels
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=10m

# Configuration JWT
# === IMPORTANT ===
# Aucun secret par défaut en production : définir JWT_SECRET (min 32 octets) obligatoirement.
jwt.secret=${JWT_SECRET}
jwt.expiration=14400000

# Logging configuration
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# CORS configuration
app.cors.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://172.214.108.8:4200,http://reconciliation.intouchgroup.net:4200}

# URL de l'application frontend (pour les liens dans les emails)
app.url=${APP_URL:http://localhost:4200}

# DevTools DESACTIVE en production (rechargement a chaud inutile et risque)
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Configuration Email - Azure AD / Microsoft Graph
# Utiliser des variables d'environnement pour les informations sensibles (OBLIGATOIRE en production)
# Pour configurer, définir les variables d'environnement suivantes :
# Windows:
#   set AZURE_TENANT_ID=your-tenant-id
#   set AZURE_CLIENT_ID=your-client-id
#   set AZURE_CLIENT_SECRET=your-client-secret
#   set MAIL_FROM=your-email@domain.com
# Linux/Mac:
#   export AZURE_TENANT_ID=your-tenant-id
#   export AZURE_CLIENT_ID=your-client-id
#   export AZURE_CLIENT_SECRET=your-client-secret
#   export MAIL_FROM=your-email@domain.com

# Azure AD Configuration pour Microsoft Graph
azure.tenant-id=${AZURE_TENANT_ID}
azure.client-id=${AZURE_CLIENT_ID}
azure.client-secret=${AZURE_CLIENT_SECRET}

# Configuration de l'adresse email d'envoi
mail.from=${MAIL_FROM}
mail.from.name=${MAIL_FROM_NAME:Reconciliation App}

# Configuration Email (Spring Mail) - SMTP Fallback (Optionnel)
spring.mail.host=${MAIL_HOST:smtp.office365.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.from=${MAIL_FROM}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.office365.com}
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2