# Profil DEV — secrets de développement uniquement.
# Ces valeurs ne doivent JAMAIS servir en production (profil prod sans fallback).
# En production : définir JWT_SECRET et DB_PASSWORD, ne PAS activer ce profil.
jwt.secret=${DEV_JWT_SECRET:dev-secret-0123456789abcdefghijklmnopqrstuvwxyz-dev-only-48chars}

# ------------------------------------------------------------------
# Email DEV : compte Gmail utilitaire utilise comme EXPEDITEUR pour TOUS
# les envois (lien d'activation, mot de passe genere, reinitialisation,
# controle interne), quel que soit le contexte (plateforme SUPER_ADMIN ou
# entreprise INTOUCH). L'adresse expeditrice = spring.mail.username.
# Mot de passe d'application Gmail (16 caracteres).
# DEV uniquement : la production exige MAIL_USERNAME / MAIL_PASSWORD via
# variables d'environnement (voir application-prod.properties).
# ------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}