# Configuration de la base de données
# Utiliser des variables d'environnement pour les secrets (recommandé)
# --- Configuration SSL / HTTPS ---

# Le port standard pour HTTPS est 443, mais souvent 8443 en développement
# SSL disabled for development - uncomment lines below to enable SSL
server.port=8085
#server.ssl.enabled=true
#server.ssl.key-store=file:C:/Certs/reconciliation/reconciliation.jks
#server.ssl.key-store-type=PKCS12
#server.ssl.key-store-password=
#server.ssl.key-alias=reconciliation
#server.ssl.key-password=reconciliation
# Définir les variables d'environnement:
# Windows: set DB_PASSWORD=votre_mot_de_passe
# Linux/Mac: export DB_PASSWORD=votre_mot_de_passe
spring.datasource.url=jdbc:mysql://localhost:3306/Reconciliation_app?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&allowMultiQueries=true&useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA/Hibernate
# Le schema est desormais gere par Flyway : Hibernate ne fait que VALIDER.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Pas d'EntityManager ouvert pour toute la requete (deja false en prod/test) :
# avec open-in-view, la session Hibernate est creee avant que le login ne
# positionne TenantContext, et reste figee sur NO_TENANT -> droits vides au login
# pour les profils non administrateurs.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuration Flyway (versionnage du schema)
# - base existante sans historique Flyway : marqueur de baseline en V1 (V1 non execute), puis V2+ ;
# - base vide : V1 s'execute (creation complete du schema).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Baseline schema ReconciliApp 2026-10-12
spring.flyway.validate-on-migrate=true

# Configuration du serveur
#server.port=8443

# Configuration de l'encodage UTF-8
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Désactiver la console H2

spring.h2.console.enabled=false

# Configuration des logs - Niveau réduit pour moins de verbosité
logging.level.org.springframework=INFO
logging.level.com.reconciliation=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.apache.poi=WARN
# Réduire le bruit des erreurs de parsing HTTP (scanners de port, clients mal configurés)
logging.level.org.apache.coyote.http11=WARN
logging.level.org.apache.catalina.connector=WARN

# Configuration optimisée pour fichiers volumineux (jusqu'à 700k lignes)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
spring.servlet.multipart.file-size-threshold=20MB
spring.servlet.multipart.location=/tmp
spring.servlet.multipart.resolve-lazily=true

# JVM Memory Configuration - Optimisé pour 700k lignes
# Note: ces propriétés Spring ne définissent PAS le heap JVM réel.
# Le heap est défini via JAVA_OPTS dans le Dockerfile (-Xms4g -Xmx8g)
spring.jvm.memory.initial=4096m
spring.jvm.memory.max=12288m

# Configuration des timeouts étendus pour 700k lignes (30 minutes pour les très gros fichiers)
server.tomcat.connection-timeout=1800000
server.tomcat.max-http-form-post-size=3GB
server.tomcat.max-connections=300
server.tomcat.accept-count=150
server.tomcat.threads.max=300
server.tomcat.threads.min-spare=30

# Timeout de lecture des requêtes (important pour gros uploads)
server.tomcat.max-swallow-size=3GB

# Limite de taille du body HTTP (JSON) gérée par Tomcat (max-swallow-size ci-dessus)
# Note: spring.mvc.max-request-size / spring.web.max-request-size ne sont PAS des propriétés
# Spring Boot reconnues (elles sont ignorées) — la limite effective est Tomcat.

# Configuration Jackson pour streaming (évite charger tout en mémoire)
# La feature USE_BIG_DECIMAL_FOR_FLOATS est appliquée réellement dans JacksonConfig.java
spring.jackson.parser.allow-unquoted-field-names=true
spring.jackson.parser.allow-single-quotes=true
spring.jackson.deserialization.fail-on-unknown-properties=false

# Optimisations Hibernate pour 700k lignes
spring.jpa.properties.hibernate.jdbc.batch_size=2000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Configuration du cache Spring (Caffeine)
spring.cache.type=caffeine
spring.cache.cache-names=autoProcessingModels
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=10m

# Configuration JWT
# === IMPORTANT ===
# Plus aucun secret par défaut : l'application refuse de démarrer si JWT_SECRET n'est pas défini.
# Génération (PowerShell) :
#   -join ((48..122 | ForEach-Object {[char]$_} | Get-Random -Count 48))
# Pas de profil implicite : definir SPRING_PROFILES_ACTIVE=dev (local) ou prod.
# Démarrage local recommandé (profil dev + secret JWT local) :
#   .\start-dev.ps1
# Équivalent manuel :
#   $env:SPRING_PROFILES_ACTIVE='dev' ; $env:JWT_SECRET='<48 caractères>' ; mvn spring-boot:run
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}
jwt.secret=${JWT_SECRET}
jwt.expiration=14400000

# Compte plateforme SUPER_ADMIN (etape 2)
# Cree de facon idempotente au premier demarrage (jamais modifie ensuite).
# Compte par defaut : SUPER_ADMIN_USERNAME / SUPER_ADMIN_PASSWORD (mot de passe
# provisoire, changement OBLIGATOIRE a la premiere connexion). Ne jamais journaliser
# le mot de passe. En production, surcharger ces variables d'environnement :
# SUPER_ADMIN_USERNAME, SUPER_ADMIN_PASSWORD, SUPER_ADMIN_EMAIL.
app.super-admin.username=${SUPER_ADMIN_USERNAME:superadmin}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:passer123}
app.super-admin.email=${SUPER_ADMIN_EMAIL:moufathamed@gmail.com}

# Rate limiting (fenêtre glissante par IP, filtre RateLimitingFilter)
# La valeur par defaut du filtre (60/min) est trop serree : la rafale du chargement
# initial (login -> modules actifs, photo, logs, page d'accueil) declenchait un 429
# "Trop de requetes". Surcharge possible via variables d'environnement.
rate.limit.enabled=${RATE_LIMIT_ENABLED:true}
rate.limit.requests-per-minute=${RATE_LIMIT_PER_MINUTE:300}
rate.limit.requests-per-hour=${RATE_LIMIT_PER_HOUR:10000}

# Logging configuration
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# CORS configuration
app.cors.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:4200,https://localhost:4200,http://localhost:3000,https://localhost:3000,http://172.214.108.8:4200,https://172.214.108.8:4200,http://reconciliation.intouchgroup.net:4200,https://reconciliation.intouchgroup.net:4200,https://reconciliation.intouchgroup.net}

# URL de l'application frontend (pour les liens dans les emails)
app.url=${APP_URL:http://localhost:4200}

# Spring Boot DevTools Configuration - Rechargement automatique
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=400ms
spring.devtools.restart.additional-paths=src/main/java,src/main/resources
spring.devtools.restart.exclude=static/**,public/**,templates/**,META-INF/maven/**,META-INF/resources/**

# Configuration Email (Spring Mail)
# Utiliser des variables d'environnement pour les informations sensibles
# Pour configurer, définir les variables d'environnement suivantes :
# Windows: 
#   set MAIL_HOST=smtp.gmail.com
#   set MAIL_PORT=587
#   set MAIL_USERNAME=votre_email@gmail.com
#   set MAIL_PASSWORD=votre_mot_de_passe_application
# Linux/Mac: 
#   export MAIL_HOST=smtp.gmail.com
#   export MAIL_PORT=587
#   export MAIL_USERNAME=votre_email@gmail.com
#   export MAIL_PASSWORD=votre_mot_de_passe_application
# 
# Note: Pour Gmail, vous devez utiliser un "Mot de passe d'application" et non votre mot de passe principal.
# Pour créer un mot de passe d'application Gmail :
# 1. Allez dans votre compte Google > Sécurité
# 2. Activez la vérification en deux étapes si ce n'est pas déjà fait
# 3. Sous "Mots de passe des applications", créez un nouveau mot de passe d'application
# 4. Utilisez ce mot de passe d'application pour MAIL_PASSWORD
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Relance e-mail quotidienne des commentaires de blocage (page « État des réconciliations ») :
# heure d'envoi (cron Spring) et fuseau horaire (vide = fuseau du serveur).
reco.blocking-comment.mail-alert.cron=${RECO_MAIL_ALERT_CRON:0 0 8 * * *}
reco.blocking-comment.mail-alert.zone=${RECO_MAIL_ALERT_ZONE:}