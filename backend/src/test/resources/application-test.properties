# Configuration pour tests d'integration.
# NOTE (2026-10-12) : la configuration Testcontainers d'origine (jdbc:tc:mysql:8.0) exige
# Docker, indisponible dans l'environnement de build actuel. Sans profil "test" actif, les
# tests @SpringBootTest retombaient sur la datasource de l'application (base reelle) et
# declenchaient Flyway dessus. On pointe donc desormais explicitement sur une base MySQL
# locale DEDIEE et jetable (reco_test), creee automatiquement :
#   -> JAMAIS la base applicative (Reconciliation_app), jamais de migration sur les donnees reelles.
# Flyway est desactive : le schema est cree par Hibernate (create-drop) depuis les entites.
spring.datasource.url=jdbc:mysql://localhost:3306/reco_test?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&allowMultiQueries=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Désactiver les migrations Flyway/Liquibase pour les tests
spring.flyway.enabled=false
spring.liquibase.enabled=false

# JWT pour tests
jwt.secret=test-secret-key-for-testing-only-minimum-32-characters-long
jwt.expiration=3600000

# Email désactivé pour tests
spring.mail.host=localhost
spring.mail.port=25

# Logging pour tests
logging.level.org.springframework=WARN
logging.level.com.reconciliation=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.testcontainers=INFO
