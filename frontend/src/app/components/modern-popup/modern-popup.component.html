<div class="modern-popup-overlay" *ngIf="isVisible" (click)="onClose()">
  <div class="modern-popup" (click)="$event.stopPropagation()">
    <div class="popup-header">
      <h3 class="popup-title">{{ config.title || ('POPUP.notification' | translate) }}</h3>
      <button type="button" class="popup-close ds-btn ds-btn--ghost" (click)="onClose()" [attr.aria-label]="'COMMON.actions.close' | translate">
        <i class="fas fa-times" aria-hidden="true"></i>
      </button>
    </div>
    
    <div class="popup-content">
      <p class="popup-message">{{ config.message }}</p>
      <p class="popup-lines-saved" *ngIf="config.linesSaved">
        {{ 'POPUP.savedLines' | translate: { count: config.linesSaved } }}
      </p>
    </div>
    
    <div class="popup-actions">
      <button 
        type="button"
        class="ds-btn ds-btn--ghost popup-btn popup-btn-cancel" 
        *ngIf="config.showCancelButton"
        (click)="onCancel()">
        {{ config.cancelText || ('COMMON.actions.cancel' | translate) }}
      </button>
      <button 
        type="button"
        class="ds-btn ds-btn--primary popup-btn popup-btn-confirm popup-btn-{{ config.type || 'info' }}"
        (click)="onConfirm()">
        {{ config.confirmText || ('COMMON.actions.ok' | translate) }}
      </button>
    </div>
  </div>
</div>
