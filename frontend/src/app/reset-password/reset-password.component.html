<div class="reset-password-container">
  <form class="reset-password-card" [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
    <h2>{{ 'AUTO_RESET_PASSWORD.ui.nouveauMotDePasse' | translate }}</h2>
    <p class="hint">{{ 'AUTO_RESET_PASSWORD.ui.choisissezUnMotDePasseDe' | translate }}</p>

    <label class="ds-label" for="newPassword">{{ 'AUTO_RESET_PASSWORD.ui.nouveauMotDePasse' | translate }}</label>
    <div class="password-field">
      <input class="ds-input" id="newPassword" [type]="hidePassword ? 'password' : 'text'" formControlName="newPassword" autocomplete="new-password">
      <button type="button" class="ds-btn ds-btn--ghost ds-btn--sm toggle" (click)="togglePasswordVisibility()">
        {{ hidePassword ? ('ACT.show' | translate) : ('ACT.hide' | translate) }}
      </button>
    </div>

    <label class="ds-label" for="confirmPassword">{{ 'AUTO_RESET_PASSWORD.ui.confirmerLeMotDePasse' | translate }}</label>
    <input class="ds-input" id="confirmPassword" [type]="hidePassword ? 'password' : 'text'" formControlName="confirmPassword" autocomplete="new-password">

    <div class="error" *ngIf="error">{{ error }}</div>
    <div class="success" *ngIf="success">{{ success }}</div>

    <button type="submit" class="ds-btn ds-btn--primary" [disabled]="loading || success">
      {{ loading ? ('AUTO_RESET_PASSWORD.ui.reinitialisation' | translate) : ('PLT.acc.actionResetPassword' | translate) }}
    </button>

    <a class="back-link" routerLink="/login">{{ 'AUTO_RESET_PASSWORD.ui.retourALaConnexion' | translate }}</a>
  </form>
</div>
