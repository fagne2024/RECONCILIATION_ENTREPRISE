<div class="reset-password-container">
  <form class="reset-password-card" [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
    <h2>Nouveau mot de passe</h2>
    <p class="hint">Choisissez un mot de passe de 8 caractères minimum, avec majuscule, minuscule, chiffre et caractère spécial.</p>

    <label class="ds-label" for="newPassword">Nouveau mot de passe</label>
    <div class="password-field">
      <input class="ds-input" id="newPassword" [type]="hidePassword ? 'password' : 'text'" formControlName="newPassword" autocomplete="new-password">
      <button type="button" class="ds-btn ds-btn--ghost ds-btn--sm toggle" (click)="togglePasswordVisibility()">
        {{ hidePassword ? 'Afficher' : 'Masquer' }}
      </button>
    </div>

    <label class="ds-label" for="confirmPassword">Confirmer le mot de passe</label>
    <input class="ds-input" id="confirmPassword" [type]="hidePassword ? 'password' : 'text'" formControlName="confirmPassword" autocomplete="new-password">

    <div class="error" *ngIf="error">{{ error }}</div>
    <div class="success" *ngIf="success">{{ success }}</div>

    <button type="submit" class="ds-btn ds-btn--primary" [disabled]="loading || success">
      {{ loading ? 'Réinitialisation…' : 'Réinitialiser le mot de passe' }}
    </button>

    <a class="back-link" routerLink="/login">Retour à la connexion</a>
  </form>
</div>
